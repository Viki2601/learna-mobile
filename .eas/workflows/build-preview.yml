name: Build Android preview

on:
  push:
    branches: ["main"]

jobs:
  build_android:
    name: Build Android APK
    type: build
    params:
      platform: android
      profile: preview

  publish_release:
    name: Publish APK to GitHub Release
    needs: [build_android]
    environment: preview
    runs_on: linux-medium
    steps:
      - uses: eas/download_build
        id: download
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
      - name: Create release and upload APK
        run: |
          set -e
          SHA="${{ github.sha }}"
          TAG="apk-${SHA:0:7}"
          BODY="Build page: https://expo.dev/accounts/vishnu-26/projects/learna-mobile/builds/${{ needs.build_android.outputs.build_id }}"

          RELEASE=$(curl -sf -X POST \
            -H "Authorization: Bearer $GH_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$SHA\",\"name\":\"Learna $TAG\",\"body\":\"$BODY\",\"make_latest\":\"true\"}")

          UPLOAD_URL=$(echo "$RELEASE" | jq -r .upload_url | sed 's/{.*}//')

          curl -sf -X POST \
            -H "Authorization: Bearer $GH_RELEASE_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"${{ steps.download.outputs.artifact_path }}" \
            "$UPLOAD_URL?name=learna.apk"
