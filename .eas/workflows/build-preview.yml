name: Build Android preview

on:
  push:
    branches: ["main"]

jobs:
  build_android:
    name: Build Android APK
    type: build
    params:
      platform: android
      profile: preview

  publish_release:
    name: Publish APK to GitHub Release
    needs: [build_android]
    environment: preview
    runs_on: linux-medium
    steps:
      - uses: eas/download_build
        id: download
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
      - name: Create release and upload APK
        run: |
          SHA="${{ github.sha }}"
          TAG="apk-${SHA:0:7}"
          BODY="Build page: https://expo.dev/accounts/vishnu-26/projects/learna-mobile/builds/${{ needs.build_android.outputs.build_id }}"

          if [ -z "$GH_RELEASE_TOKEN" ]; then
            echo "GH_RELEASE_TOKEN is empty. Check the EAS environment variable."
            exit 1
          fi

          HTTP=$(curl -s -o release.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$SHA\",\"name\":\"Learna $TAG\",\"body\":\"$BODY\",\"make_latest\":\"true\"}")
          echo "Create release status: $HTTP"
          cat release.json
          [ "$HTTP" -lt 400 ] || exit 1

          UPLOAD_URL=$(jq -r .upload_url release.json | sed 's/{.*}//')

          HTTP=$(curl -s -o asset.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_RELEASE_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"${{ steps.download.outputs.artifact_path }}" \
            "$UPLOAD_URL?name=learna.apk")
          echo "Upload status: $HTTP"
          cat asset.json
          [ "$HTTP" -lt 400 ] || exit 1
